version: '3.8'

services:
  # TimescaleDB (基于 PostgreSQL)
  timescaledb:
    image: timescale/timescaledb:latest-pg14
    container_name: binance_bot_db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=mybot_db
    ports:
      - "5432:5432"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PgBouncer (连接池)
  pgbouncer:
    image: bitnami/pgbouncer:latest
    container_name: binance_bot_pgbouncer
    environment:
      - POSTGRESQL_HOST=timescaledb
      - POSTGRESQL_PORT=5432
      - POSTGRESQL_USERNAME=postgres
      - POSTGRESQL_PASSWORD=password
      - PGBOUNCER_DATABASE=*
      - PGBOUNCER_POOL_MODE=transaction
      - PGBOUNCER_MAX_CLIENT_CONN=1000
      - PGBOUNCER_DEFAULT_POOL_SIZE=20
      - PGBOUNCER_IGNORE_STARTUP_PARAMETERS=extra_float_digits
    ports:
      - "6432:6432"
    depends_on:
      - timescaledb
    restart: always

  # 可选: Adminer (Web 数据库管理界面)
  adminer:
    image: adminer
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - timescaledb

volumes:
  timescaledb_data:
